# Plesk -> zammaddemo.world-ict.nl -> Apache & nginx Settings
#   [ ] Proxy mode          <- OFF: nginx must serve this vhost itself, not hand it to Apache
#   Additional nginx directives:  paste everything below this header
#
# Mirrors /opt/zammad/contrib/nginx/zammad_ssl.conf, minus what Plesk already
# provides (listen, server_name, ssl_*, logs). Plesk wraps these directives in
# its own `server { }` block, so no `upstream` blocks: the loopback addresses
# are written out directly.

client_max_body_size 50M;

# Static assets straight from disk — the Rails server never sees these.
location ~ ^/(assets/|robots.txt|humans.txt|favicon.ico|apple-touch-icon.png) {
    root /opt/zammad/public;
    expires max;
}

# Legacy websocket server (the app's live updates).
location /ws {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header CLIENT_IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Always https: Plesk terminates TLS, and Zammad's CSRF check compares this
    # against http_type — `$scheme` would read "http" behind the proxy.
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 86400;
    proxy_pass http://127.0.0.1:6042;
}

# Action Cable.
location /cable {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header CLIENT_IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 86400;
    proxy_pass http://127.0.0.1:3000;
}

location / {
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header CLIENT_IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-User "";
    proxy_read_timeout 180;
    proxy_pass http://127.0.0.1:3000;

    gzip on;
    gzip_types text/plain text/xml text/css image/svg+xml application/javascript application/x-javascript application/json application/xml;
    gzip_proxied any;
}
